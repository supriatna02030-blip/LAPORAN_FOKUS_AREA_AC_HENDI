<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAP.FOKUS MKT 19 TOKO - Bisa Edit & Save Harian</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#080808;color:#eee;font-family:system-ui}
.mono{font-family:monospace}
.edit{cursor:text;min-width:40px}
.edit:focus{outline:2px solid #22c55e;background:#123212!important}
.edit:hover{background:#222!important}
</style>
</head>
<body class="pb-20">
<div class="bg-yellow-400 text-black p-3 sticky top-0 z-20">
<div class="flex flex-wrap justify-between items-center gap-2">
<div><h1 class="font-bold">LAP.FOKUS MKT PER JAM AREA P'HENDY - 19 TOKO</h1><p class="text-xs">Klik angka hijau/biru untuk isi Actual - Auto hitung ACV</p></div>
<div class="flex gap-2 items-center">
<input type="date" id="tgl" class="bg-black text-yellow-400 px-3 py-1.5 rounded text-sm font-bold border" onchange="changeDate()">
<button onclick="prevDay()" class="bg-black text-white px-2 py-1 rounded">◀</button>
<button onclick="nextDay()" class="bg-black text-white px-2 py-1 rounded">▶</button>
<button onclick="saveAll()" class="bg-green-600 text-white px-5 py-2 rounded font-bold text-sm">💾 SIMPAN</button>
<button onclick="exportCSV()" class="bg-black text-white px-3 py-2 rounded text-xs">Export</button>
</div>
</div>
<div class="flex gap-2 mt-2 text-[11px]"><span id="info-tgl" class="bg-black text-yellow-400 px-3 py-1 rounded"></span><span id="info-saved" class="bg-green-600 text-white px-3 py-1 rounded hidden">✓ Tersimpan</span><span class="bg-black text-white px-3 py-1 rounded">19 Toko Active - Klik sel untuk edit</span></div>
</div>

<div class="grid grid-cols-4 gap-2 p-2 bg-zinc-900 text-xs">
<div class="bg-zinc-800 p-2 rounded"><div class="text-zinc-400">TGL</div><div id="kpi-tgl" class="font-bold"></div></div>
<div class="bg-zinc-800 p-2 rounded"><div class="text-zinc-400">TARGET</div><div id="kpi-target" class="font-bold text-xl">0</div></div>
<div class="bg-zinc-800 p-2 rounded"><div class="text-zinc-400">ACTUAL</div><div id="kpi-actual" class="font-bold text-xl text-green-400">0</div></div>
<div class="bg-zinc-800 p-2 rounded"><div class="text-zinc-400">ACV</div><div id="kpi-acv" class="font-bold text-xl text-yellow-400">0%</div></div>
</div>

<div class="p-2 overflow-auto max-h-[65vh] border border-zinc-800">
<table class="w-full text-[11px] mono border-collapse">
<thead class="sticky top-0 z-10">
<tr class="bg-cyan-400 text-black"><th class="p-2 border">NO</th><th class="p-2 border">KODE</th><th class="p-2 border">NAMA</th><th class="p-2 border">TGT</th><th class="p-2 border bg-green-500">ACT S1</th><th class="p-2 border bg-blue-500 text-white">ACT S2</th><th class="p-2 border">TOTAL</th><th class="p-2 border">ACV</th><th class="p-2 border">PWP</th><th class="p-2 border">SERBA</th><th class="p-2 border">SEGER</th></tr>
</thead>
<tbody id="tbody"></tbody>
<tfoot><tr class="bg-yellow-400 text-black font-bold"><td colspan="3" class="p-2 text-center border">TOTAL 19 TOKO</td><td id="ft-target" class="p-2 border text-center">0</td><td id="ft-s1" class="p-2 border text-center bg-green-800 text-white">0</td><td id="ft-s2" class="p-2 border text-center bg-blue-800 text-white">0</td><td id="ft-total" class="p-2 border text-center">0</td><td id="ft-acv" class="p-2 border text-center">0%</td><td id="ft-pwp" class="p-2 border">0</td><td id="ft-serba" class="p-2 border">0</td><td id="ft-seger" class="p-2 border">0</td></tr></tfoot>
</table>
</div>

<div class="p-2 bg-zinc-900 mt-2"><div class="text-xs font-bold mb-2">📅 HISTORY (klik untuk buka hari lain):</div><div id="history" class="flex gap-2 overflow-auto"></div></div>

<script>
const tokoList=[
{kode:'J937',nama:'ANGGREK III'},{kode:'K791',nama:'KARBELA'},{kode:'K792',nama:'KARBELA 2'},{kode:'K796',nama:'KPDK'},{kode:'K797',nama:'SAMPOERNA 5'},{kode:'K930',nama:'KARBELA 3'},{kode:'KD10',nama:'SETIABUDI BARAT'},{kode:'KD32',nama:'BEK MURAD'},{kode:'KD70',nama:'GAMA TOWER'},{kode:'KE48',nama:'OB GEDUNG WI'},{kode:'KF85',nama:'ST. SUDIRMAN'},{kode:'KF33',nama:'KARET PEDURENAN'},{kode:'KF37',nama:'KAWI RAYA 16'},{kode:'KF58',nama:'JPM DUKUH ATAS'},{kode:'KF67',nama:'GUNTUR RAYA 14'},{kode:'KG22',nama:'TANGKUBAN PERAHU'},{kode:'KE19',nama:'KENDAL 24'},{kode:'KE94',nama:'FPG BLORA MENTENG'},{kode:'KF71',nama:'DS KUNINGAN'},
];
function todayStr(){return new Date().toISOString().slice(0,10);}
let currentDate=localStorage.getItem('lastDate')||todayStr();
document.getElementById('tgl').value=currentDate;
function getKey(d){return 'mkt_'+d;}
function loadDate(d){let r=localStorage.getItem(getKey(d));return r?JSON.parse(r):tokoList.map(t=>({kode:t.kode,nama:t.nama,psm:{t:100,s1:0,s2:0},pwp:0,serba:0,seger:0}));}
function saveDate(d,data){localStorage.setItem(getKey(d),JSON.stringify(data));localStorage.setItem('lastDate',d);let h=JSON.parse(localStorage.getItem('history')||'[]');if(!h.includes(d)){h.push(d);h.sort().reverse();localStorage.setItem('history',JSON.stringify(h));}}
let data=loadDate(currentDate);
function render(){
let tb=document.getElementById('tbody');tb.innerHTML='';let sumT=0,sumS1=0,sumS2=0,sumTot=0,sumPWP=0,sumSER=0,sumSEG=0;
data.forEach((r,i)=>{
let tot=(r.psm.s1||0)+(r.psm.s2||0);sumT+=r.psm.t;sumS1+=r.psm.s1;sumS2+=r.psm.s2;sumTot+=tot;sumPWP+=r.pwp;sumSER+=r.serba;sumSEG+=r.seger;
let p=Math.round(tot/r.psm.t*100)||0;let cls=p>=100?'bg-green-600 text-white':p>=50?'bg-yellow-500 text-black':'bg-red-600 text-white';
tb.innerHTML+=`<tr class='border-b border-zinc-700'><td class='p-2 border text-center'>${i+1}</td><td class='p-2 border font-bold'>${r.kode}</td><td class='p-2 border'>${r.nama}</td><td class='p-2 border text-center bg-zinc-900'>${r.psm.t}</td><td contenteditable='true' class='edit p-2 border text-center bg-green-900/40 text-green-300 font-bold' onblur='upd(${i},\"s1\",this.innerText)'>${r.psm.s1}</td><td contenteditable='true' class='edit p-2 border text-center bg-blue-900/40 text-blue-300 font-bold' onblur='upd(${i},\"s2\",this.innerText)'>${r.psm.s2}</td><td class='p-2 border text-center font-bold'>${tot}</td><td class='p-2 border text-center ${cls}'>${p}%</td><td contenteditable='true' class='edit p-2 border text-center' onblur='upd2(${i},\"pwp\",this.innerText)'>${r.pwp}</td><td contenteditable='true' class='edit p-2 border text-center' onblur='upd2(${i},\"serba\",this.innerText)'>${r.serba}</td><td contenteditable='true' class='edit p-2 border text-center' onblur='upd2(${i},\"seger\",this.innerText)'>${r.seger}</td></tr>`;
});
document.getElementById('ft-target').innerText=sumT;document.getElementById('ft-s1').innerText=sumS1;document.getElementById('ft-s2').innerText=sumS2;document.getElementById('ft-total').innerText=sumTot;document.getElementById('ft-pwp').innerText=sumPWP;document.getElementById('ft-serba').innerText=sumSER;document.getElementById('ft-seger').innerText=sumSEG;
document.getElementById('kpi-target').innerText=sumT;document.getElementById('kpi-actual').innerText=sumTot;let avg=sumT?Math.round(sumTot/sumT*100):0;document.getElementById('kpi-acv').innerText=avg+'%';document.getElementById('ft-acv').innerText=avg+'%';document.getElementById('kpi-tgl').innerText=currentDate;document.getElementById('info-tgl').innerText='📅 '+currentDate;renderHistory();
}
function upd(i,k,v){data[i].psm[k]=parseInt(v)||0;saveDate(currentDate,data);render();}
function upd2(i,k,v){data[i][k]=parseInt(v)||0;saveDate(currentDate,data);render();}
function saveAll(){saveDate(currentDate,data);let el=document.getElementById('info-saved');el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2000);renderHistory();}
function changeDate(){currentDate=document.getElementById('tgl').value;data=loadDate(currentDate);render();}
function prevDay(){let d=new Date(currentDate);d.setDate(d.getDate()-1);currentDate=d.toISOString().slice(0,10);document.getElementById('tgl').value=currentDate;data=loadDate(currentDate);render();}
function nextDay(){let d=new Date(currentDate);d.setDate(d.getDate()+1);currentDate=d.toISOString().slice(0,10);document.getElementById('tgl').value=currentDate;data=loadDate(currentDate);render();}
function renderHistory(){let hist=JSON.parse(localStorage.getItem('history')||'[]');let div=document.getElementById('history');div.innerHTML='';if(hist.length==0){div.innerHTML='<span class=text-zinc-600>Belum ada history</span>';return;}hist.forEach(date=>{let active=date===currentDate?'bg-yellow-400 text-black':'bg-zinc-800 text-white';div.innerHTML+=`<button onclick="loadHist('${date}')" class='${active} px-3 py-1 rounded text-xs'>${date}</button>`;});}
function loadHist(date){currentDate=date;document.getElementById('tgl').value=date;data=loadDate(date);render();}
function exportCSV(){let csv='TANGGAL,KODE,NAMA,TARGET,S1,S2,TOTAL,ACV\n';data.forEach(r=>{let tot=r.psm.s1+r.psm.s2;csv+=`${currentDate},${r.kode},${r.nama},${r.psm.t},${r.psm.s1},${r.psm.s2},${tot},${Math.round(tot/r.psm.t*100)}%\n`;});let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`LAP_${currentDate}.csv`;a.click();}
render();
</script>
</body>
</html>
