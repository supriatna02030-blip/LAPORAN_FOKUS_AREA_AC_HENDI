<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAP.FOKUS MKT PER JAM AREA P'HENDY - FINAL 19 TOKO</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#050505;color:#ddd;font-size:11px;font-family:system-ui}
.mono{font-family:monospace}
.edit{cursor:text}
.edit:focus{outline:2px solid #facc15;background:#222!important}
.tgt{background:#1e1e1e;color:#facc15;text-align:center;font-weight:bold}
.ok{color:#22ff55!important;font-weight:bold;text-shadow:0 0 5px #22ff55}
.bad{color:#ff3333!important;font-weight:bold}
.total{background:#222;font-weight:bold;text-align:center}
</style>
</head>
<body class="pb-16">
<div class="bg-yellow-400 text-black p-2 sticky top-0 z-30">
<div class="flex flex-wrap justify-between items-center gap-2">
<div><div class="font-black text-[13px]">LAP.FOKUS MKT PER JAM AREA P'HENDY - 19 TOKO FINAL</div><div class="text-[10px]">KLIK ANGKA UNTUK ISI | WARNA HIJAU = CAPAI TARGET PER SHIFT, MERAH = BELUM | SAVE PER TANGGAL</div></div>
<div class="flex gap-2 items-center">
<input type="date" id="tgl" class="bg-black text-yellow-400 px-3 py-1.5 rounded font-bold text-xs border" onchange="changeDate()">
<button onclick="saveAll()" class="bg-green-600 text-white px-5 py-2 rounded font-bold text-xs">💾 SIMPAN HARI INI</button>
<button onclick="exportCSV()" class="bg-black text-white px-3 py-2 rounded text-xs">Export CSV</button>
</div>
</div>
<div class="flex gap-2 mt-2 text-[10px]"><span id="info" class="bg-black text-yellow-400 px-3 py-1 rounded"></span><span id="saved" class="bg-green-600 text-white px-3 py-1 rounded hidden">✓ Tersimpan</span></div>
</div>
<div class="overflow-auto p-1" style="max-height:80vh">
<table class="w-full mono border-collapse text-[10px]">
<thead class="sticky top-0 z-10 bg-cyan-400 text-black">
<tr>
<th class="border p-1">NO</th><th class="border p-1">KODE</th><th class="border p-1">NAMA</th>
<th class="border p-1 bg-yellow-300">PSM T</th><th class="border p-1">PSM S1</th><th class="border p-1">PSM S2</th><th class="border p-1">TOT</th><th class="border p-1">ACV</th>
<th class="border p-1 bg-yellow-300">PWP T</th><th class="border p-1">PWP S1</th><th class="border p-1">PWP S2</th><th class="border p-1">TOT</th><th class="border p-1">ACV</th>
<th class="border p-1 bg-yellow-300">SERBA T</th><th class="border p-1">SERBA S1</th><th class="border p-1">SERBA S2</th><th class="border p-1">TOT</th><th class="border p-1">ACV</th>
<th class="border p-1 bg-yellow-300">SEGER T</th><th class="border p-1">SEGER S1</th><th class="border p-1">SEGER S2</th><th class="border p-1">TOT</th><th class="border p-1">ACV</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>
<div class="p-2 bg-zinc-900 mt-1"><div class="text-[10px] font-bold">📅 HISTORY:</div><div id="hist" class="flex gap-1 overflow-auto mt-1"></div></div>
<script>
const K=['J937','K791','K792','K796','K797','K930','KD10','KD32','KD70','KE48','KF85','KF33','KF37','KF58','KF67','KG22','KE19','KE94','KF71'];
const N=['ANGGREK III','KARBELA','KARBELA 2','KPDK','SAMPOERNA 5','KARBELA 3','SETIABUDI BARAT','BEK MURAD','GAMA TOWER','OB GEDUNG WI','ST. SUDIRMAN','KARET PEDURENAN','KAWI RAYA 16','JPM DUKUH ATAS','GUNTUR RAYA 14','TANGKUBAN PERAHU','KENDAL 24','FPG BLORA MENTENG','DS KUNINGAN'];
function mk(){return {t:10,s1:0,s2:0};}
function load(d){let r=localStorage.getItem('FINAL_'+d);if(r)return JSON.parse(r);return K.map((k,i)=>({kode:k,nama:N[i],psm:mk(),pwp:mk(),serba:mk(),seger:mk()}));}
function today(){return new Date().toISOString().slice(0,10);}let cur=localStorage.getItem('lastFinal')||today();document.getElementById('tgl').value=cur;let data=load(cur);
function calc(it){let tot=it.s1+it.s2;return{tot,acv:it.t?Math.round(tot/it.t*100):0};}
function col(a,t){return a>=t?'ok':'bad';}
function render(){
let tb=document.getElementById('tbody');tb.innerHTML='';
data.forEach((r,i)=>{
let cp=calc(r.psm),cw=calc(r.pwp),cs=calc(r.serba),cg=calc(r.seger);
tb.innerHTML+=`<tr class='border-b border-zinc-800'><td class='border p-1 text-center'>${i+1}</td><td class='border p-1 font-bold'>${r.kode}</td><td class='border p-1'>${r.nama}</td>
<td contenteditable class='edit border p-1 tgt' onblur='up(${i},\"psm\",\"t\",this.innerText)'>${r.psm.t}</td>
<td contenteditable class='edit border p-1 text-center ${col(r.psm.s1,r.psm.t)}' onblur='up(${i},\"psm\",\"s1\",this.innerText)'>${r.psm.s1}</td>
<td contenteditable class='edit border p-1 text-center ${col(r.psm.s2,r.psm.t)}' onblur='up(${i},\"psm\",\"s2\",this.innerText)'>${r.psm.s2}</td>
<td class='border total'>${cp.tot}</td><td class='border text-center ${cp.acv>=100?'ok':'bad'}'>${cp.acv}%</td>
<td contenteditable class='edit border p-1 tgt' onblur='up(${i},\"pwp\",\"t\",this.innerText)'>${r.pwp.t}</td>
<td contenteditable class='edit border p-1 text-center ${col(r.pwp.s1,r.pwp.t)}' onblur='up(${i},\"pwp\",\"s1\",this.innerText)'>${r.pwp.s1}</td>
<td contenteditable class='edit border p-1 text-center ${col(r.pwp.s2,r.pwp.t)}' onblur='up(${i},\"pwp\",\"s2\",this.innerText)'>${r.pwp.s2}</td>
<td class='border total'>${cw.tot}</td><td class='border text-center ${cw.acv>=100?'ok':'bad'}'>${cw.acv}%</td>
<td contenteditable class='edit border p-1 tgt' onblur='up(${i},\"serba\",\"t\",this.innerText)'>${r.serba.t}</td>
<td contenteditable class='edit border p-1 text-center ${col(r.serba.s1,r.serba.t)}' onblur='up(${i},\"serba\",\"s1\",this.innerText)'>${r.serba.s1}</td>
<td contenteditable class='edit border p-1 text-center ${col(r.serba.s2,r.serba.t)}' onblur='up(${i},\"serba\",\"s2\",this.innerText)'>${r.serba.s2}</td>
<td class='border total'>${cs.tot}</td><td class='border text-center ${cs.acv>=100?'ok':'bad'}'>${cs.acv}%</td>
<td contenteditable class='edit border p-1 tgt' onblur='up(${i},\"seger\",\"t\",this.innerText)'>${r.seger.t}</td>
<td contenteditable class='edit border p-1 text-center ${col(r.seger.s1,r.seger.t)}' onblur='up(${i},\"seger\",\"s1\",this.innerText)'>${r.seger.s1}</td>
<td contenteditable class='edit border p-1 text-center ${col(r.seger.s2,r.seger.t)}' onblur='up(${i},\"seger\",\"s2\",this.innerText)'>${r.seger.s2}</td>
<td class='border total'>${cg.tot}</td><td class='border text-center ${cg.acv>=100?'ok':'bad'}'>${cg.acv}%</td>
</tr>`;
});
document.getElementById('info').innerText='📅 '+cur+' - 19 Toko | Warna: Hijau capai, Merah belum';
let h=JSON.parse(localStorage.getItem('histFinal')||'[]');let hd=document.getElementById('hist');hd.innerHTML='';h.forEach(d=>{let a=d===cur?'bg-yellow-400 text-black':'bg-zinc-800 text-white';hd.innerHTML+=`<button onclick="openH('${d}')" class='${a} px-2 py-1 rounded text-[10px]'>${d}</button>`;});
}
function up(i,cat,k,v){data[i][cat][k]=parseInt(v)||0;localStorage.setItem('FINAL_'+cur,JSON.stringify(data));render();}
function saveAll(){localStorage.setItem('FINAL_'+cur,JSON.stringify(data));localStorage.setItem('lastFinal',cur);let h=JSON.parse(localStorage.getItem('histFinal')||'[]');if(!h.includes(cur)){h.push(cur);h.sort().reverse();localStorage.setItem('histFinal',JSON.stringify(h));}let el=document.getElementById('saved');el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),1500);render();}
function changeDate(){cur=document.getElementById('tgl').value;data=load(cur);render();}
function openH(d){cur=d;document.getElementById('tgl').value=d;data=load(d);render();}
function exportCSV(){let csv='TGL,KODE,NAMA,PSM_T,S1,S2,TOT,ACV\\n';data.forEach(r=>{let cp=calc(r.psm);csv+=`${cur},${r.kode},${r.nama},${r.psm.t},${r.psm.s1},${r.psm.s2},${cp.tot},${cp.acv}%\\n`;});let b=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`LAP_FINAL_${cur}.csv`;a.click();}
render();
</script>
</body>
</html>
